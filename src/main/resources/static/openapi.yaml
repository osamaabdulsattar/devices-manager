openapi: 3.0.3
info:
  title: Devices Manager API
  description: |
    RESTful API specification for managing Devices and Brands.
    
    ### Domain Entities
    - **Device**: Physical or virtual device containing an ID, Name, associated Brand, State, and Creation timestamp.
    - **Brand**: Separate entity representing device manufacturers/brands.
    
    ### Concurrency control
    Single-device responses carry an `ETag` header holding the device version (also returned as `version`).
    Send it back in `If-Match` on `PUT`, `PATCH` or `DELETE` to make the change conditional:
    if the device has been modified in the meantime the request fails with `412 Precondition Failed`.
    `If-Match` is optional; without it the last write wins (concurrent writes inside the same instant
    still fail with `409 Conflict`).

    ### Device States
    - `available`: Device is ready for assignment/use.
    - `in-use`: Device is currently assigned or in operation.
    - `inactive`: Device is decommissioned, defective, or disabled.
  version: 1.0.0
  contact:
    name: Devices Management Team
    email: support@example.com

servers:
  - url: /api/v1

tags:
  - name: Devices
    description: CRUD operations and queries for devices
  - name: Brands
    description: Operations for managing device brands

paths:
  /devices:
    get:
      tags:
        - Devices
      summary: Fetch all devices (with optional filters)
      description: |
        Retrieves a page of devices, newest first by default.
        Supports filtering by brand ID, brand name, and operational state.
        Multiple filters can be combined and are applied with AND semantics
        (e.g. `?state=available&brandId=...`).
        A filter that matches nothing (including a non-existent `brandId`) returns `200` with an empty page.
      operationId: getAllDevices
      parameters:
        - name: brandId
          in: query
          required: false
          description: Filter devices by brand entity ID
          schema:
            type: string
            format: uuid
            example: 3f8e2a1c-7b5d-4c9e-8f6a-1d2c3b4a5e6f
        - name: brandName
          in: query
          required: false
          description: |
            Filter devices by brand name using a case-insensitive substring match
            (an exact name also matches). E.g. `app`, `APPLE` and `Apple` all match brand `Apple`.
          schema:
            type: string
            example: Apple
        - name: state
          in: query
          required: false
          description: Filter devices by current state
          schema:
            $ref: '#/components/schemas/DeviceState'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: sort
          in: query
          required: false
          description: |
            Sort order as `property[,asc|desc]`; repeat the parameter to sort by several properties.
            Sortable properties: `name`, `state`, `createdAt`, `brand.name`. Defaults to `createdAt,desc`.
          schema:
            type: array
            items:
              type: string
            example: [ 'name,asc' ]
      responses:
        '200':
          description: Successfully retrieved a page of devices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePage'
        '400':
          description: Invalid query parameter provided (including an unknown sort property)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    post:
      tags:
        - Devices
      summary: Create a new device
      description: Creates a new device associated with an existing brand entity. Creation time and ID are automatically generated.
      operationId: createDevice
      requestBody:
        required: true
        description: Device payload to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreateRequest'
      responses:
        '201':
          description: Device created successfully
          headers:
            Location:
              description: URI of the newly created device
              schema:
                type: string
                example: /api/v1/devices/9b2f6c1e-4d3a-4e8b-a7c5-2f1d0e9b8a76
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '400':
          description: Invalid request payload or validation failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Request conflicts with existing data (e.g. the brand was deleted concurrently)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          $ref: '#/components/responses/InvalidReference'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /devices/{id}:
    get:
      tags:
        - Devices
      summary: Fetch a single device
      description: Retrieves the details of a single device by its unique ID.
      operationId: getDeviceById
      parameters:
        - $ref: '#/components/parameters/DeviceIdParam'
      responses:
        '200':
          description: Device found and returned
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '404':
          description: Device not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    put:
      tags:
        - Devices
      summary: Fully update an existing device
      description: Replaces all mutable attributes of an existing device. All updatable fields must be provided in the request body.
      operationId: updateDeviceFully
      parameters:
        - $ref: '#/components/parameters/DeviceIdParam'
        - $ref: '#/components/parameters/IfMatchParam'
      requestBody:
        required: true
        description: Complete updated device details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdateRequest'
      responses:
        '200':
          description: Device updated successfully
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '400':
          description: Invalid input or validation failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Device not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: |
            The device is `in-use` and the request changes its name or brand,
            or it was modified concurrently by another request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/InvalidReference'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    patch:
      tags:
        - Devices
      summary: Partially update an existing device
      description: Updates only the specified fields of an existing device. Fields omitted from the payload remain unchanged.
      operationId: updateDevicePartially
      parameters:
        - $ref: '#/components/parameters/DeviceIdParam'
        - $ref: '#/components/parameters/IfMatchParam'
      requestBody:
        required: true
        description: Subset of device fields to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePatchRequest'
      responses:
        '200':
          description: Device partially updated successfully
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '400':
          description: Invalid input or validation failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Device not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: |
            The device is `in-use` and the request changes its name or brand,
            or it was modified concurrently by another request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/InvalidReference'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    delete:
      tags:
        - Devices
      summary: Delete a single device
      description: Deletes an existing device by its ID.
      operationId: deleteDevice
      parameters:
        - $ref: '#/components/parameters/DeviceIdParam'
        - $ref: '#/components/parameters/IfMatchParam'
      responses:
        '204':
          description: Device successfully deleted (No Content)
        '400':
          description: Malformed device ID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Device not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Device is currently in use and cannot be deleted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /brands:
    get:
      tags:
        - Brands
      summary: Fetch all brands
      description: Retrieves a page of device brands, sorted by name by default.
      operationId: getAllBrands
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: sort
          in: query
          required: false
          description: Sort order as `property[,asc|desc]`. Sortable property is `name`. Defaults to `name,asc`.
          schema:
            type: array
            items:
              type: string
            example: [ 'name,desc' ]
      responses:
        '200':
          description: Successfully retrieved a page of brands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandPage'
        '400':
          description: Invalid query parameter provided (including an unknown sort property)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    post:
      tags:
        - Brands
      summary: Create a new brand
      description: Registers a new brand entity. Leading and trailing whitespace in the name is trimmed.
      operationId: createBrand
      requestBody:
        required: true
        description: Brand payload to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandRequest'
      responses:
        '201':
          description: Brand created successfully
          headers:
            Location:
              description: URI of the newly created brand
              schema:
                type: string
                example: /api/v1/brands/3f8e2a1c-7b5d-4c9e-8f6a-1d2c3b4a5e6f
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '400':
          description: Invalid request payload or validation failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Brand name already exists (compared case-insensitively)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /brands/{id}:
    get:
      tags:
        - Brands
      summary: Fetch a single brand
      description: Retrieves details of a specific brand by its ID.
      operationId: getBrandById
      parameters:
        - $ref: '#/components/parameters/BrandIdParam'
      responses:
        '200':
          description: Brand found and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '404':
          description: Brand not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    put:
      tags:
        - Brands
      summary: Update an existing brand
      description: Updates the properties of an existing brand.
      operationId: updateBrand
      parameters:
        - $ref: '#/components/parameters/BrandIdParam'
      requestBody:
        required: true
        description: Updated brand data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandRequest'
      responses:
        '200':
          description: Brand updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '400':
          description: Invalid input or validation failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Brand not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Brand name already in use by another brand
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    delete:
      tags:
        - Brands
      summary: Delete a brand
      description: Deletes an existing brand. Note that brands with associated devices cannot be deleted without first reassigning or deleting those devices.
      operationId: deleteBrand
      parameters:
        - $ref: '#/components/parameters/BrandIdParam'
      responses:
        '204':
          description: Brand successfully deleted (No Content)
        '404':
          description: Brand not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Cannot delete brand because devices are still associated with it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  headers:
    ETag:
      description: Current version of the device, usable in a later `If-Match` header
      schema:
        type: string
        example: '"3"'

  responses:
    InvalidReference:
      description: |
        The request body references a brand that does not exist (`brandId`).
        `404` is reserved for resources addressed by the URL.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    PreconditionFailed:
      description: The `If-Match` header does not match the current device version
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: Zero-based page index
      schema:
        type: integer
        minimum: 0
        default: 0

    SizeParam:
      name: size
      in: query
      required: false
      description: Page size. Values above 100 are capped at 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    IfMatchParam:
      name: If-Match
      in: header
      required: false
      description: |
        `ETag` of the device as last seen by the client. When present, the request only succeeds
        if the device has not changed since; otherwise `412` is returned. `*` skips the check.
      schema:
        type: string
        example: '"3"'

    DeviceIdParam:
      name: id
      in: path
      required: true
      description: Unique identifier of the device
      schema:
        type: string
        format: uuid
        example: 9b2f6c1e-4d3a-4e8b-a7c5-2f1d0e9b8a76

    BrandIdParam:
      name: id
      in: path
      required: true
      description: Unique identifier of the brand
      schema:
        type: string
        format: uuid
        example: 3f8e2a1c-7b5d-4c9e-8f6a-1d2c3b4a5e6f

  schemas:
    DeviceState:
      type: string
      enum:
        - available
        - in-use
        - inactive
      example: available
      description: |
        Current state of the device:
        - `available`: Device is ready for use.
        - `in-use`: Device is currently in use.
        - `inactive`: Device is decommissioned or inactive.

    Brand:
      type: object
      description: Represents a brand entity
      properties:
        id:
          type: string
          format: uuid
          example: 3f8e2a1c-7b5d-4c9e-8f6a-1d2c3b4a5e6f
          description: Unique identifier of the brand
          readOnly: true
        name:
          type: string
          example: Apple
          description: Brand name
      required:
        - id
        - name

    BrandRequest:
      type: object
      description: Request payload for creating or updating a brand
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Apple
          description: Unique (case-insensitive) name of the brand
      required:
        - name

    DeviceResponse:
      type: object
      description: Full device representation returned in responses
      properties:
        id:
          type: string
          format: uuid
          example: 9b2f6c1e-4d3a-4e8b-a7c5-2f1d0e9b8a76
          description: Unique identifier of the device
          readOnly: true
        name:
          type: string
          example: iPhone 15 Pro
          description: Device name / model
        brand:
          $ref: '#/components/schemas/Brand'
        state:
          $ref: '#/components/schemas/DeviceState'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-07T08:30:00Z'
          description: Timestamp when the device was created (ISO-8601)
          readOnly: true
        version:
          type: integer
          format: int64
          example: 3
          description: Version of the device, incremented on every change. Equal to the `ETag` value.
          readOnly: true
      required:
        - id
        - name
        - brand
        - state
        - createdAt
        - version

    DevicePage:
      type: object
      description: A page of devices
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/DeviceResponse'
        page:
          type: integer
          example: 0
          description: Zero-based index of this page
        size:
          type: integer
          example: 20
          description: Requested page size
        totalElements:
          type: integer
          format: int64
          example: 42
          description: Number of devices matching the filters across all pages
        totalPages:
          type: integer
          example: 3
          description: Number of pages available
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages

    BrandPage:
      type: object
      description: A page of brands
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Brand'
        page:
          type: integer
          example: 0
          description: Zero-based index of this page
        size:
          type: integer
          example: 20
          description: Requested page size
        totalElements:
          type: integer
          format: int64
          example: 5
          description: Number of brands across all pages
        totalPages:
          type: integer
          example: 1
          description: Number of pages available
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages

    DeviceCreateRequest:
      type: object
      description: Request payload for creating a new device
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          example: iPhone 15 Pro
          description: Name or model of the device
        brandId:
          type: string
          format: uuid
          example: 3f8e2a1c-7b5d-4c9e-8f6a-1d2c3b4a5e6f
          description: ID of an existing brand entity
        state:
          $ref: '#/components/schemas/DeviceState'
          default: available
          description: Initial state of the device. Defaults to `available` if omitted.
      required:
        - name
        - brandId

    DeviceUpdateRequest:
      type: object
      description: Request payload for fully updating (PUT) an existing device. All updatable fields must be provided.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          example: iPhone 15 Pro Max
          description: Updated device name
        brandId:
          type: string
          format: uuid
          example: 3f8e2a1c-7b5d-4c9e-8f6a-1d2c3b4a5e6f
          description: Updated brand entity ID
        state:
          $ref: '#/components/schemas/DeviceState'
          description: Updated state of the device
      required:
        - name
        - brandId
        - state

    DevicePatchRequest:
      type: object
      description: Request payload for partially updating (PATCH) an existing device. Only specified fields will be updated.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          example: iPhone 15 Pro Max
          description: Optional updated device name
        brandId:
          type: string
          format: uuid
          example: c4d7e9f1-2a3b-4c5d-9e8f-7a6b5c4d3e2f
          description: Optional updated brand entity ID
        state:
          $ref: '#/components/schemas/DeviceState'
          description: Optional updated state of the device

    ProblemDetail:
      type: object
      description: |
        Error response following [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) (Problem Details for HTTP APIs).
        Clients should branch on `type`; `detail` is a human-readable explanation that may change.

        | `type` | Status | Meaning |
        | :--- | :--- | :--- |
        | `/problems/resource-not-found` | 404 | The device or brand in the URL does not exist |
        | `/problems/validation-failed` | 400 | Request body fields are invalid (see `errors`) |
        | `/problems/malformed-request` | 400 | Request body is not valid JSON or has an invalid value |
        | `/problems/invalid-parameter` | 400 | A path or query parameter is invalid (incl. unknown sort property) |
        | `/problems/invalid-reference` | 422 | The body references a brand that does not exist |
        | `/problems/device-in-use` | 409 | The change is not allowed while the device is `in-use` |
        | `/problems/brand-in-use` | 409 | The brand still has devices and cannot be deleted |
        | `/problems/duplicate-brand-name` | 409 | Another brand already has this name |
        | `/problems/concurrent-modification` | 409 | The resource was modified concurrently; retry |
        | `/problems/data-conflict` | 409 | The request conflicts with existing data |
        | `/problems/precondition-failed` | 412 | `If-Match` does not match the current version |
        | `/problems/internal-error` | 500 | Unexpected server error |
        | `about:blank` | 404, 405, 406, 415, ... | Generic HTTP error (e.g. unknown path, unsupported method or media type) |
      properties:
        type:
          type: string
          format: uri-reference
          example: /problems/device-in-use
          description: Identifies the problem type
        title:
          type: string
          example: Device is in use
          description: Short, human-readable summary of the problem type
        status:
          type: integer
          example: 409
          description: HTTP status code
        detail:
          type: string
          example: Device cannot be deleted while it is in use
          description: Human-readable explanation specific to this occurrence
        instance:
          type: string
          format: uri-reference
          example: /api/v1/devices/9b2f6c1e-4d3a-4e8b-a7c5-2f1d0e9b8a76
          description: The request path that caused the problem
        errors:
          type: array
          description: Field-level errors (only for `validation-failed`)
          items:
            $ref: '#/components/schemas/FieldViolation'
      required:
        - type
        - title
        - status

    FieldViolation:
      type: object
      description: Validation error for a specific field
      properties:
        field:
          type: string
          example: name
          description: Field name that failed validation
        message:
          type: string
          example: Device name must not be blank
          description: Reason for validation failure
      required:
        - field
        - message
