spring.application.name=devices-manager

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/devices_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Actuator: expose health (with liveness/readiness probes) only
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Swagger UI / OpenAPI Configuration
springdoc.swagger-ui.url=/openapi.yaml
springdoc.api-docs.enabled=false

# Pagination: requested page sizes above this are capped (defaults are set via @PageableDefault)
spring.data.web.pageable.max-page-size=100
